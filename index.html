<!doctype html>

<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevBoard, tablero Kanban para equipos de producto.">
  
  <title>DevBoard — Gestión de tareas</title>
  
  <link rel="stylesheet" href="./src/css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js" defer></script>
  <script src="./src/js/app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="DevBoard inicio"><span class="brand-mark">D</span><span>DevBoard</span></a>
    
    <div class="header-actions">
      <span class="stats" id="stats">0 tareas</span>
      <button class="button button-primary" id="new-task-button">+ Nueva tarea</button>
      <button class="menu-button" id="menu-button" aria-label="Abrir menú" aria-expanded="false">☰</button>
    </div>
    
    <nav class="mobile-menu" id="mobile-menu" hidden><a href="#board">Tablero</a><a href="#about">Acerca del proyecto</a></nav>
  </header>

  <main class="shell" id="board">
    <section class="intro"><div><p class="eyebrow">Workspace / Sprint actual</p><h1>Tablero de tareas</h1><p class="subtitle">Organiza el trabajo del equipo, una tarea a la vez.</p></div><label class="search"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Buscar tareas..." aria-label="Buscar tareas"></label></section>
    
    <section class="board" id="board-columns" aria-label="Tablero Kanban"><div class="loading">Cargando tablero...</div></section>
  </main>

  <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close" id="modal-close" aria-label="Cerrar">×</button><div id="modal-content"></div></section></div>
</body>

</html>
